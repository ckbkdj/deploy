upstream risk_gateway {
    least_conn;
    keepalive 256;
    server 127.0.0.1:8088 max_fails=3 fail_timeout=10s;
}

server {
    listen 443 ssl http2;
    server_name risk.example.com;

    ssl_certificate     /etc/letsencrypt/live/risk.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/risk.example.com/privkey.pem;

    client_max_body_size 8m;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    location / {
        proxy_pass http://risk_gateway;
        proxy_connect_timeout 10s;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_request_buffering off;
        proxy_buffering off;
        proxy_cache off;
        gzip off;
        add_header X-Accel-Buffering no always;
    }
}
